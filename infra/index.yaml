AWSTemplateFormatVersion: "2010-09-09"
Transform: "AWS::Serverless-2016-10-31"
Description: Serverless Lambda, S3, Cloudfront same-domain stack

Parameters:
  Project:
    Type: String
  Stage:
    Type: String
    AllowedValues:
      - develop
      - main

Conditions:
  IsDevelop:
    Fn::Equals:
      - Ref: Stage
      - develop
  IsMain:
    Fn::Equals:
      - Ref: Stage
      - main

Resources:
  WebLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebLogsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: S3ServerAccessLogsPolicy
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub "${WebLogsBucket.Arn}/web/*"
            Condition:
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:s3:::${Project}-${Stage}-web"
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt WebLogsBucket.Arn
              - !Sub "${WebLogsBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  SiteBasicAuthRole:
    Type: "AWS::IAM::Role"
    Condition: IsDevelop
    Metadata:
      com.aws.cloudformation.Context:
        why: lets the develop-only basic auth Lambda@Edge function read its one SSM parameter.
    Properties:
      RoleName: !Sub "${Project}-${Stage}-site-basic-auth"
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Stage
          Value: !Ref Stage
      Path: "/"
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: "AllowLambdaServiceToAssumeRole"
            Effect: "Allow"
            Action:
              - "sts:AssumeRole"
            Principal:
              Service:
                - "lambda.amazonaws.com"
                - "edgelambda.amazonaws.com"
      Policies:
        - PolicyName: !Sub "${Project}-${Stage}-site-basic-auth-ssm"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: "AllowReadBasicAuthParameter"
                Effect: "Allow"
                Action:
                  - "ssm:GetParameter"
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/portfolio/${Stage}/basic-auth"

  WebCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Metadata:
      com.aws.cloudformation.Context:
        why: caches web files at CloudFront edge locations (5 min default, 1 hour max) with gzip/brotli compression to speed up page loads and reduce S3 requests
    Properties:
      CachePolicyConfig:
        DefaultTTL: 300
        MaxTTL: 3600
        MinTTL: 0
        Name: !Sub "${Project}-${Stage}-web-cache"
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true

  WebOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Metadata:
      com.aws.cloudformation.Context:
        why: "Forwards all query strings to the origin but no cookies or headers, keeping origin requests minimal."
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub "${Project}-${Stage}-web-origin-request"
        CookiesConfig:
          CookieBehavior: none
        HeadersConfig:
          HeaderBehavior: none
        QueryStringsConfig:
          QueryStringBehavior: all

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Id: !Sub "${Project}-${Stage}-web-bucket-policy"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution.Id}"
            Action: s3:GetObject
            Resource: !Sub "${WebBucket.Arn}/*"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt WebBucket.Arn
              - !Sub "${WebBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  LambdaEdgeRole:
    Type: "AWS::IAM::Role"
    Metadata:
      com.aws.cloudformation.Context:
        why: "Lambda@Edge needs edgelambda.amazonaws.com to assume this role for CloudFront edge replication."
    Properties:
      Tags:
        - Key: Project
          Value: !Ref Project
      Path: "/"
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: "AllowLambdaServiceToAssumeRole"
            Effect: "Allow"
            Action:
              - "sts:AssumeRole"
            Principal:
              Service:
                - "lambda.amazonaws.com"
                - "edgelambda.amazonaws.com"

  WebOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Metadata:
      com.aws.cloudformation.Context:
        why: lets CloudFront read from the private web S3 bucket using signed requests, so the bucket stays blocked from direct public access
    Properties:
      OriginAccessControlConfig:
        Description: Default Origin Access Control
        Name: !Sub "${Project}-${Stage}-web-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebBucket:
    Type: AWS::S3::Bucket
    DependsOn: WebLogsBucketPolicy
    Metadata:
      com.aws.cloudformation.Context:
        why: store the built web files per stage; private, with access logs
    Properties:
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Stage
          Value: !Ref Stage
      BucketName: !Sub "${Project}-${Stage}-web"
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LoggingConfiguration:
        DestinationBucketName: !Ref WebLogsBucket
        LogFilePrefix: !Sub "web/"

  WebLogsBucket:
    Type: AWS::S3::Bucket
    Metadata:
      com.aws.cloudformation.Context:
        why: store access logs for the web S3 bucket, permanently deleted after 30 days
      guard:
        SuppressedRules:
          - S3_BUCKET_LOGGING_ENABLED
    Properties:
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Stage
          Value: !Ref Stage
      BucketName: !Sub "${Project}-${Stage}-web-logs"
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireAccessLogs
            Status: Enabled
            Prefix: "web/"
            ExpirationInDays: 30

  SiteRedirectBucket:
    Type: AWS::S3::Bucket
    Condition: IsMain
    Metadata:
      com.aws.cloudformation.Context:
        why: holds no files; its website endpoint redirects ryanmurphy.dev requests to www.ryanmurphy.dev
    Properties:
      BucketName: !Sub "${Project}-${Stage}-site-redirect"
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Stage
          Value: !Ref Stage
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      WebsiteConfiguration:
        RedirectAllRequestsTo:
          HostName: www.ryanmurphy.dev
          Protocol: https

  SiteBasicAuthFunction:
    Type: AWS::Serverless::Function
    Condition: IsDevelop
    Metadata:
      com.aws.cloudformation.Context:
        why: Lambda@Edge viewer-request function that password-protects the develop site before anything is served from cache or origin
    Properties:
      Description: >-
        Requires basic auth on the develop distribution
      CodeUri: ./functions/viewerRequests/siteBasicAuth
      Handler: index.handler
      Runtime: nodejs24.x
      Timeout: 5
      MemorySize: 128
      FunctionName: !Sub "${Project}-${Stage}-site-basic-auth"
      Role: !GetAtt SiteBasicAuthRole.Arn
      AutoPublishAlias: live
      Tags:
        Project: !Ref Project
        Stage: !Ref Stage

  WebSpaRewriteFunction:
    Type: AWS::Serverless::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: Lambda@Edge origin-request function that rewrites app routes to /index.html without changing the browser URL
    Properties:
      Description: >-
        Rewrites app routes to /index.html so react-router can handle them
      CodeUri: ./functions/originRequests/webSpaRewrite
      Handler: index.handler
      Runtime: nodejs24.x
      Timeout: 10
      FunctionName: !Sub "${Project}-${Stage}-web-spa-rewrite"
      Role: !GetAtt LambdaEdgeRole.Arn
      AutoPublishAlias: live
      Tags:
        Project: !Ref Project
        Stage: !Ref Stage

  SiteRedirectDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: IsMain
    Metadata:
      com.aws.cloudformation.Context:
        why: serves ryanmurphy.dev over HTTPS in front of the redirect bucket, whose website endpoint is HTTP only
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${Project}-${Stage}-site-redirect"
        Aliases:
          - ryanmurphy.dev
        ViewerCertificate:
          AcmCertificateArn: !Sub "{{resolve:ssm:/portfolio/${Stage}/certificate-arn}}"
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - DomainName:
              Fn::Select:
                - 2
                - Fn::Split:
                    - "/"
                    - Fn::GetAtt: SiteRedirectBucket.WebsiteURL
            Id: SiteRedirectOrigin
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
        DefaultCacheBehavior:
          TargetOriginId: SiteRedirectOrigin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # AWS managed policy: CachingDisabled
          OriginRequestPolicyId: !GetAtt WebOriginRequestPolicy.Id

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Metadata:
      com.aws.cloudformation.Context:
        why: single HTTPS entry point for the site; serves the React web app from the private S3 bucket
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${Project}-${Stage}-site"
        Aliases:
          Fn::If:
            - IsMain
            - - www.ryanmurphy.dev
            - Ref: AWS::NoValue
        ViewerCertificate:
          Fn::If:
            - IsMain
            - AcmCertificateArn: !Sub "{{resolve:ssm:/portfolio/${Stage}/certificate-arn}}"
              SslSupportMethod: sni-only
              MinimumProtocolVersion: TLSv1.2_2021
            - Ref: AWS::NoValue
        Origins:
          - DomainName: !GetAtt WebBucket.RegionalDomainName
            Id: WebOrigin
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !GetAtt WebOriginAccessControl.Id
        DefaultCacheBehavior:
          TargetOriginId: WebOrigin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: !GetAtt WebCachePolicy.Id
          OriginRequestPolicyId: !GetAtt WebOriginRequestPolicy.Id
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          LambdaFunctionAssociations:
            - EventType: origin-request
              IncludeBody: true
              LambdaFunctionARN: !Ref WebSpaRewriteFunction.Version
            - Fn::If:
              - IsDevelop
              - EventType: viewer-request
                LambdaFunctionARN: !Ref SiteBasicAuthFunction.Version
              - Ref: AWS::NoValue

Outputs:
  SiteDistributionId:
    Description: CloudFront distribution ID, read by the web workflow to invalidate the cache
    Value: !Ref SiteDistribution
