AWSTemplateFormatVersion: '2010-09-09'
Transform: 'AWS::Serverless-2016-10-31'
Description: Serverless Lambda, S3, Cloudfront same-domain stack

Parameters:
  Project:
    Type: String
  Stage:
    Type: String
    AllowedValues:
      - develop
      - main

Resources:
  FrontendS3BucketLogs:
    Type: AWS::S3::Bucket
    Metadata:
      com.aws.cloudformation.Context:
        why: store access logs for the frontend S3 bucket, permanently deleted after 30 days
      guard:
        SuppressedRules:
          - S3_BUCKET_LOGGING_ENABLED
    Properties:
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Stage
          Value: !Ref Stage
      BucketName: !Sub '${Project}-${Stage}-logs'
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireAccessLogs
            Status: Enabled
            Prefix: 'FrontendS3/'
            ExpirationInDays: 30
    
  FrontendS3BucketLogsPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendS3BucketLogs
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: S3ServerAccessLogsPolicy
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${FrontendS3BucketLogs.Arn}/FrontendS3/*'
            Condition:
              ArnLike:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:s3:::${Project}-${Stage}'
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt FrontendS3BucketLogs.Arn
              - !Sub '${FrontendS3BucketLogs.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  FrontendS3Bucket:
    Type: AWS::S3::Bucket
    DependsOn: FrontendS3BucketLogsPolicy
    Metadata:
      com.aws.cloudformation.Context:
        why: store the built frontend files per stage; private, with access logs
    Properties:
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Stage
          Value: !Ref Stage
      BucketName: !Sub '${Project}-${Stage}'
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LoggingConfiguration:
        DestinationBucketName: !Ref FrontendS3BucketLogs
        LogFilePrefix: !Sub 'FrontendS3/'

  LambdaEdgeRole:
    Type: 'AWS::IAM::Role'
    Metadata:
      com.aws.cloudformation.Context:
        why: 'Lambda@Edge needs edgelambda.amazonaws.com to assume this role for CloudFront edge replication.'
    Properties:
      Tags:
        - Key: Project
          Value: !Ref Project
      Path: '/'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: 'AllowLambdaServiceToAssumeRole'
            Effect: 'Allow'
            Action:
              - 'sts:AssumeRole'
            Principal:
              Service:
                - 'lambda.amazonaws.com'
                - 'edgelambda.amazonaws.com'

  ClientOriginRequestFunction:
    Type: AWS::Serverless::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: Lambda@Edge origin-request function that rewrites incoming URIs to the root so the React app handles routing
    Properties:
      Description: >-
        This Lambda function edits the incoming uri to redirect to the root
      CodeUri: ./functions/originRequests/client
      Handler: index.handler
      Runtime: nodejs24.x
      Timeout: 10
      FunctionName: !Sub '${Project}-${Stage}-CloudfrontReactOriginRequest'
      Role: !GetAtt LambdaEdgeRole.Arn
      AutoPublishAlias: live
      Tags:
        Project: !Ref Project
        Stage: !Ref Stage

  CloudfrontCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Metadata:
      com.aws.cloudformation.Context:
        why: caches frontend files at CloudFront edge locations (5 min default, 1 hour max) with gzip/brotli compression to speed up page loads and reduce S3 requests
    Properties:
      CachePolicyConfig:
        DefaultTTL: 300
        MaxTTL: 3600
        MinTTL: 0
        Name: !Sub 'CloudfrontCachePolicy${Stage}'
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true

  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Metadata:
      com.aws.cloudformation.Context:
        why: lets CloudFront read from the private frontend S3 bucket using signed requests, so the bucket stays blocked from direct public access
    Properties:
      OriginAccessControlConfig:
        Description: Default Origin Access Control
        Name: !Sub '${Project}-${Stage}_Static-Site-Cloudfront-OAC'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CloudfrontOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Metadata:
      com.aws.cloudformation.Context:
        why: 'Forwards all query strings to the origin but no cookies or headers, keeping origin requests minimal.'
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub 'originPolicyConfiguration${Stage}'
        CookiesConfig:
          CookieBehavior: none
        HeadersConfig:
          HeaderBehavior: none
        QueryStringsConfig:
          QueryStringBehavior: all

  CloudfrontDistribution:
    Type: AWS::CloudFront::Distribution
    Metadata:
      com.aws.cloudformation.Context:
        why: single HTTPS entry point for the app; serves the React frontend from the private S3 bucket and routes /api/v1* to API Gateway without caching
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${Project}-${Stage}'
        Origins:
          - DomainName: !GetAtt FrontendS3Bucket.RegionalDomainName
            Id: FrontendOrigin
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
        DefaultCacheBehavior:
          TargetOriginId: FrontendOrigin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: !GetAtt CloudfrontCachePolicy.Id
          OriginRequestPolicyId: !GetAtt CloudfrontOriginRequestPolicy.Id
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          LambdaFunctionAssociations:
            - EventType: origin-request
              IncludeBody: true
              LambdaFunctionARN: !Ref ClientOriginRequestFunction.Version