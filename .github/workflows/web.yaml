name: Deploy web

on:
  workflow_call: 
  push:
    branches:
      - develop
      - main
    paths:
      - web/**
      - package.json
      - .github/workflows/web.yaml
jobs:
  deploy:
    if: github.ref_name == 'develop' || github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: 'us-east-1'
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm --prefix web ci

      - name: Lint
        run: npm run web:lint

      - name: Build
        run: npm run web:build

      - name: Upload web build
        run: aws s3 sync web/dist/main/ "s3://${{ vars.PROJECT }}-${{ github.ref_name }}-web" --delete

      - name: Get distribution id
        run: |
          DistributionId=$(aws cloudformation describe-stacks \
            --stack-name "${{ vars.PROJECT }}-${{ github.ref_name }}" \
            --query "Stacks[0].Outputs[?OutputKey=='SiteDistributionId'].OutputValue" \
            --output text)
          echo "DistributionId=$DistributionId" >> "$GITHUB_ENV"

      - name: Invalidate Cloudfront
        run: |
          aws cloudfront create-invalidation --distribution-id $DistributionId --paths "/*"