name: Deploy infrastructure

on:
  workflow_call:
  
env:
  Project: ${{ vars.PROJECT }}

jobs:
  deploy:
    if: github.ref_name == 'develop' || github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/setup-sam@v1

      - name: Extract Branch Name
        shell: bash
        run: echo "Stage=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_ENV

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: "us-east-1"
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Check for SAM S3 Bucket
        shell: bash
        env:
          Project: ${{ vars.Project }}
        run: |
          chmod +x ./infra/scripts/create-sam-cli-s3-bucket.sh
          ./infra/scripts/create-sam-cli-s3-bucket.sh

      - name: Get API Gateway id
        run: |
          ApiGatewayId=$(aws cloudformation describe-stacks \
            --stack-name "$Project-$Stage-api" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiGatewayId'].OutputValue" \
            --output text)
          echo "ApiGatewayId=$ApiGatewayId" >> "$GITHUB_ENV"

      - name: Set and Print Overrides
        shell: bash
        working-directory: infra
        run: |
          chmod +x ./scripts/print-parameter-overrides.sh
          chmod +x ./scripts/set-parameter-overrides.sh
          ./scripts/set-parameter-overrides.sh
          ./scripts/print-parameter-overrides.sh

      - name: Build Cloudformation Package
        working-directory: infra
        run: |
          aws cloudformation package \
          --template-file ./index.yaml \
          --output-template-file packaged-template.yaml \
          --s3-bucket $Project-sam-cli

      - name: Deploy Cloudformation
        working-directory: infra
        run: |
          aws cloudformation deploy \
          --template-file packaged-template.yaml \
          --stack-name $Project-$Stage \
          --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
          --parameter-overrides $(./scripts/print-parameter-overrides.sh)

