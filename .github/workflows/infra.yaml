name: Deploy infrastructure

on:
  push:
    branches:
      - develop
      - main
    paths:
      - infra/**
      - .github/workflows/infra.yaml
env: 
  Project: ${{ vars.PROJECT }}

jobs:
  deploy:
    if: github.ref_name == 'develop' || github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/setup-sam@v1

      - name: Extract Branch Name
        shell: bash
        run: echo "Stage=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_ENV
        
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: 'us-east-1'
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Check for SAM S3 Bucket
        shell: bash
        env:
          Project: ${{ vars.Project }}
        run: |
          chmod +x ./infra/scripts/create-sam-cli-s3-bucket.sh
          ./infra/scripts/create-sam-cli-s3-bucket.sh

      - name: Set and Print Overrides
        shell: bash
        working-directory: infra
        run: |
          chmod +x ./scripts/print-parameter-overrides.sh
          chmod +x ./scripts/set-parameter-overrides.sh
          ./scripts/set-parameter-overrides.sh
          ./scripts/print-parameter-overrides.sh